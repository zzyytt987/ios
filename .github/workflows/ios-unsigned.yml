name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned IPA
        run: |
          cd ios
          pod install --repo-update 2>/dev/null || pod install
          xcodebuild \
            -workspace enterprise-mobile.xcworkspace \
            -scheme enterprise-mobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/enterprise-mobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          cd ..

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/enterprise-mobile.xcarchive/Products/Applications/enterprise-mobile.app Payload/
          zip -r enterprise-mobile-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-mobile-unsigned
          path: enterprise-mobile-unsigned.ipa
