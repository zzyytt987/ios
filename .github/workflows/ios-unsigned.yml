name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web
        run: npx expo export --platform web

      - name: Fix for Capacitor
        run: |
          sed -i '' 's/overflow: hidden;/overflow: auto;/g' dist/index.html
          sed -i '' 's|</head>|<script>document.addEventListener("DOMContentLoaded",function(){var s=document.createElement("style");s.textContent="input,textarea,select,[contenteditable]{-webkit-user-select:text!important;pointer-events:auto!important}div[data-focusable]{-webkit-user-select:auto!important}";document.head.appendChild(s);setInterval(function(){document.querySelectorAll("input,textarea").forEach(function(e){e.style.pointerEvents="auto";e.style.webkitUserSelect="text";e.parentElement&&(e.parentElement.style.pointerEvents="auto")})},500)})</script></head>|' dist/index.html

      - name: Init Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned IPA
        run: |
          ls -la ios/App/
          cd ios/App
          if [ -f App.xcworkspace ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath ./build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath ./build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi
          cd ../..

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r enterprise-mobile-web-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-mobile-web-unsigned
          path: enterprise-mobile-web-unsigned.ipa
