name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web
        run: npx expo export --platform web

      - name: Fix CSS for Capacitor
        run: |
          sed -i '' 's/overflow: hidden;/overflow: auto;/g' dist/index.html

      - name: DEBUG - Add test input before RN app
        run: |
          BODY_CLOSE=$(grep -n '</body>' dist/index.html | head -1 | cut -d: -f1)
          sed -i '' "${BODY_CLOSE}i\\
          <h2 style='padding:20px 20px 0;font-family:sans-serif'>测试</h2>\\
          <input type='text' placeholder='HTML输入框-能点吗?' style='margin:10px 20px;width:calc(100% - 40px);padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px'>\\
          <hr style='margin:10px 20px'>" dist/index.html

      - name: Init Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned IPA
        run: |
          ls -la ios/App/
          cd ios/App
          if [ -f App.xcworkspace ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath ./build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath ./build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi
          cd ../..

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r enterprise-mobile-web-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-mobile-web-unsigned
          path: enterprise-mobile-web-unsigned.ipa
